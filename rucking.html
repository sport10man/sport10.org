<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>負重行走專輯 Rucking Sessions | Sport10 運動實驗室</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ea;--fg:#1d1f1a;--mut:#6b6e63;--line:#d6d3c6;--card:#fff;--acc:#d9480f;--olive:#4a5238}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14160f;--fg:#ecebe2;--mut:#9a9d8f;--line:#2c3025;--card:#1c1f16;--acc:#ff7a3d;--olive:#9aa57a}}
:root[data-theme="dark"]{--bg:#14160f;--fg:#ecebe2;--mut:#9a9d8f;--line:#2c3025;--card:#1c1f16;--acc:#ff7a3d;--olive:#9aa57a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:13px;color:var(--mut);letter-spacing:.04em}
.top b{color:var(--fg)}
.lang button{background:none;border:1px solid var(--line);color:var(--fg);padding:3px 10px;font-size:12px;cursor:pointer}
.lang button.on{background:var(--fg);color:var(--bg)}
.hero{padding:28px 0 36px;border-bottom:3px solid var(--fg)}
.kick{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.big{font:900 clamp(110px,30vw,220px)/.85 "Arial Narrow","Helvetica Neue",Impact,sans-serif;letter-spacing:-.04em;margin:10px 0 6px;color:var(--olive)}
h1{font-size:clamp(30px,7vw,46px);line-height:1.15;margin:0 0 12px}
.lede{max-width:34em;color:var(--mut);margin:0 0 22px}
.btns a{display:inline-block;padding:10px 18px;margin:0 8px 8px 0;font-weight:700;text-decoration:none;border:2px solid var(--fg)}
.btns a.p{background:var(--fg);color:var(--bg)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:26px;border-top:1px solid var(--line)}
.meta div{padding:12px 12px 0 0;font-size:14px}
.meta small{display:block;color:var(--mut);font-size:12px;letter-spacing:.06em}
.chap{margin:44px 0 6px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.chap span{font:900 14px "Arial Narrow",sans-serif;color:var(--acc);letter-spacing:.14em}
.chap h2{margin:0;font-size:22px}
.chap em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px}
.trk{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:background .15s}
.trk:hover{background:var(--card)}
.n{font:900 34px/1 "Arial Narrow","Helvetica Neue",Impact,sans-serif;color:var(--olive);text-align:right}
.t{font-weight:700;font-size:17px;line-height:1.35}
.d{color:var(--mut);font-size:14px;grid-column:2}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;border:1px solid var(--acc);color:var(--acc);padding:0 6px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.date{font-size:12px;color:var(--mut);margin-left:8px;white-space:nowrap}
.trk:hover .t{color:var(--acc)}
.b .n{color:var(--acc)}
footer{margin:48px 0 30px;padding-top:18px;border-top:3px solid var(--fg);font-size:13px;color:var(--mut)}
footer a{margin-right:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="https://sport10.org" style="text-decoration:none"><b>Sport10</b> 運動實驗室</a><span class="lang"><button class="on" data-l="zh">中文</button><button data-l="en">EN</button></span></div>

<header class="hero">
<div class="kick" data-zh="訓練專輯 · 文章精選" data-en="Training album · Article selection">訓練專輯 · 文章精選</div>
<div class="big">13</div>
<h1 data-zh="負重行走專輯 Rucking Sessions" data-en="Rucking Sessions">負重行走專輯 Rucking Sessions</h1>
<p class="lede" data-zh="背著重量，一步一步往前走。從原則、課表、測驗到實戰記錄，把 Sport10 寫過的負重行走文章排成一張專輯，照順序聽，或直接跳到你要的那一首。" data-en="Carry weight, keep moving. From principles and plans to tests and field logs, Sport10's rucking articles arranged as an album. Play in order, or skip to the track you need. (Articles are in Chinese.)">背著重量，一步一步往前走。從原則、課表、測驗到實戰記錄，把 Sport10 寫過的負重行走文章排成一張專輯，照順序聽，或直接跳到你要的那一首。</p>
<div class="btns"><a class="p" href="#c1" data-zh="從第一首開始" data-en="Start at track 1">從第一首開始</a><a href="#bonus" data-zh="看延伸曲目" data-en="Bonus tracks">看延伸曲目</a></div>
<div class="meta">
<div><small data-zh="曲目" data-en="TRACKS">曲目</small>13 + 4 Bonus</div>
<div><small data-zh="時間跨度" data-en="SPAN">時間跨度</small>2024 – 2026</div>
<div><small data-zh="章節" data-en="SIDES">章節</small>原則 · 課表 · 測驗 · 實戰</div>
<div><small data-zh="來源" data-en="SOURCE">來源</small>sport10.org</div>
</div>
</header>

<main id="list"></main>

<footer>
<p><b>Sport10 運動實驗室</b> 戰術運動、體能、資訊科技和相關先進知識交流</p>

</footer>
</div>

});
h+='</section>';
});
document.getElementById('list').innerHTML=h;
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){
var l=b.dataset.l;
document.querySelectorAll('.lang button').forEach(function(o){o.classList.toggle('on',o===b)});
document.documentElement.lang=l==='en'?'en':'zh-Hant';
document.querySelectorAll('[data-'+l+']').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
