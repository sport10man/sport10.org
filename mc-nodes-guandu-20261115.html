<script>
const SVG_W = 1800, SVG_H = 4640;

function renderPNG(cb) {
  const svg = document.getElementById("poster");
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = SVG_W;
    canvas.height = SVG_H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#f5f2fc";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(b => cb(b), "image/png");
  };
  img.src = url;
}

function getHTMLBlob() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  return new Blob([html], { type: "text/html;charset=utf-8" });
}

function save(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.download = name;
  a.href = url;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadPNG() {
  renderPNG(b => save(b, "meshcore-nodes-20261111.png"));
}

function downloadHTML() {
  save(getHTMLBlob(), "meshcore-poster-20261111.html");
}

/* --- 最小 ZIP 打包器（STORE 不壓縮，含 CRC32） --- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(entries) {
  // entries: [{name, data(Uint8Array)}]
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;

  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data);
    const sz = e.data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);   // local file header
    lh.setUint16(4, 20, true);           // version
    lh.setUint16(6, 0, true);            // flags
    lh.setUint16(8, 0, true);            // method: store
    lh.setUint16(10, 0, true);           // time
    lh.setUint16(12, 0x58D1, true);      // date (2026-11-11 approx)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, sz, true);
    lh.setUint32(22, sz, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);

    chunks.push(new Uint8Array(lh.buffer), nameBytes, e.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);   // central dir header
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true);
    ch.setUint16(14, 0x58D1, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, sz, true);
    ch.setUint32(24, sz, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true);
    ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameBytes);

    offset += 30 + nameBytes.length + sz;
  }

  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);

  return new Blob([...chunks, ...central, new Uint8Array(eocd.buffer)], { type: "application/zip" });
}

function downloadZIP() {
  renderPNG(pngBlob => {
    const htmlBlob = getHTMLBlob();
    Promise.all([
      pngBlob.arrayBuffer(),
      htmlBlob.arrayBuffer()
    ]).then(([pngBuf, htmlBuf]) => {
      const zip = makeZip([
        { name: "meshcore-nodes-20261111.png",  data: new Uint8Array(pngBuf) },
        { name: "meshcore-poster-20261111.html", data: new Uint8Array(htmlBuf) }
      ]);
      save(zip, "meshcore-poster-20261111.zip");
    });
  });
}
