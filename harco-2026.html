function draw(){
 document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.d===S.day?'on':'');
 const R=rows(),P=R.filter(r=>r.i!=='觀眾票'),n=k=>P.filter(r=>r.i===k).length;
 const teams=Math.round(n('雙人組')/2+n('親子雙人組')/2+n('四人接力組')/4);
 const K=[[P.length,'參賽人數'],[R.length-P.length,'觀眾票'],[n('個人組')+n('單人加倍組'),'單人（含加倍）'],[teams,'雙人／親子／接力隊伍（估）'],[P.filter(r=>r.p).length,'待編號（無編號與時段）'],[new Set(P.map(r=>r.t).filter(Boolean)).size,'不重複隊名']];
 $('kpis').innerHTML=K.map(k=>`<div class="k"><b>${k[0].toLocaleString()}</b><span>${k[1]}</span></div>`).join('');
 const all=S.day==='all';
 $('charts').innerHTML=bars('報名項目','i',P,['個人組','單人加倍組','雙人組','親子雙人組','四人接力組'],all)+bars('類別（男／女／混合）','c',P,['男子','女子','混合','親子'],all)+bars('年齡組','a',P.filter(r=>r.a),['16-24歲組','25-34歲組','35-44歲組','45-54歲組','55-64歲組','65歲以上','40歲以下組','40歲以上組','不分齡','親子組'],all)+bars('衣服尺寸','s',P,['XS','S','M','L','XL','XXL','130','150'],all)+bars('出發時段人數','h',P.filter(r=>r.h),null,all);
 const sh=R.slice(0,S.lim);
 $('tb').innerHTML=sh.map(r=>`<tr><td>${r.d}</td><td${r.p?' class="p"':''}>${r.b||(r.i==='觀眾票'?'—':'待編號')}</td><td>${r.n}</td><td>${r.t||''}</td><td>${r.i}</td><td>${r.c}</td><td>${r.a||''}</td><td>${r.s||'—'}</td><td>${r.h||''}</td></tr>`).join('');
 $('cnt').textContent=`符合條件 ${R.length.toLocaleString()} 筆，目前顯示 ${sh.length.toLocaleString()} 筆`;
 $('more').style.display=R.length>sh.length?'block':'none'}
draw();
</script></body></html>
